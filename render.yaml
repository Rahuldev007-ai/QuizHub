services:
  - type: web
    name: quizhub
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn quiz.wsgi:application"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
